<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14th Inaugural Lecture Countdown</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #061b2d;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
  }
  .poster-wrap {
    position: relative;
    width: min(1100px, 100%);
    overflow: visible;
    border-radius: 14px;
    box-shadow: 0 18px 55px rgba(0,0,0,.45);
    background: #fff;
  }
  .poster {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Countdown panel placed over the lower part of the poster */
  .countdown-panel {
    position: relative;
    left: auto;
    bottom: auto;
    transform: none;
    width: 100%;
    margin-top: 10px;
    padding: 13px 18px 15px;
    border-radius: 16px;
    background: #003d22;
    border: 2px solid rgba(255,255,255,.9);
    box-shadow: 0 5px 18px rgba(0,0,0,.25);
    color: #fff;
    text-align: center;
    backdrop-filter: none;
  }
  .label {
    font-size: clamp(12px, 1.6vw, 20px);
    font-weight: 900;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(5px, 1vw, 12px);
  }
  .unit {
    background: rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 8px 4px;
  }
  .number {
    display: block;
    font-size: clamp(23px, 4vw, 48px);
    line-height: 1;
    font-weight: 900;
    text-shadow: 0 2px 4px rgba(0,0,0,.9);
  }
  .unit-name {
    display: block;
    margin-top: 5px;
    font-size: clamp(9px, 1.15vw, 14px);
    text-transform: uppercase;
    letter-spacing: .8px;
    font-weight: 700;
  }
  .target {
    margin-top: 8px;
    font-size: clamp(9px, 1.1vw, 13px);
    opacity: .95;
  }
  .live {
    font-size: clamp(20px, 4vw, 44px);
    font-weight: 900;
    padding: 12px;
    letter-spacing: 1px;
  }

  @media (max-width: 600px) {
    body { padding: 5px; }
    .poster-wrap { border-radius: 6px; }
    .countdown-panel {
      width: 100%;
      margin-top: 6px;
      padding: 8px 8px 9px;
      border-radius: 10px;
    }
    .label { margin-bottom: 5px; letter-spacing: .5px; }
    .unit { padding: 5px 2px; border-radius: 6px; }
    .target { display: none; }
  }
</style>
</head>

<script>
  // Event time: 22 October 2026 at 2:00 PM, Nigeria time (WAT, UTC+1).
  const target = new Date("2026-10-22T14:00:00+01:00").getTime();

  const pad = n => String(n).padStart(2, "0");

  function updateCountdown() {
    const now = Date.now();
    const distance = target - now;

    if (distance <= 0) {
      document.getElementById("timer").innerHTML =
        '<div class="live" style="grid-column: 1 / -1;">THE EVENT IS LIVE TODAY!</div>';
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("days").textContent = pad(days);
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
